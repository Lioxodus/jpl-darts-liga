<!DOCTYPE html>

<html lang="de">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>JPL Darts Liga</title>

				<style>
					body {
					margin: 0;
					font-family: Arial;
					background: black;
					color: white;
					}

					nav {
					display: flex;
					gap: 10px;
					justify-content: center;
					padding: 15px;
					background: #111;
					}

					nav a {
					color: white;
					text-decoration: none;
					padding: 10px 15px;
					border-radius: 10px;
					border: 1px solid #00b7ff;
					cursor: pointer;
					}

					nav a.active {
					background: #00b7ff;
					}

					.page {
					display: none;
					padding: 20px;
					}

					.page.active {
					display: block;
					}

					table {
					width: 100%;
					border-collapse: collapse;
					}

					td, th {
					padding: 10px;
					border-bottom: 1px solid #333;
					}

				</style>

			</head>

	<body>

		<nav>
			<a data-page="start" class="active">Start</a>
			<a data-page="tabelle">Tabelle</a>
			<a data-page="ergebnisse">Ergebnisse</a>
			<a data-page="news">News</a>
			<a data-page="regeln">Regeln</a>
		</nav>

		<!-- START -->

		<div id="start" class="page active">
			<h1>JPL Darts Liga</h1>
			<p>Online Liga für Scolia & AutoDarts</p>

			<a href="https://discord.gg/US46DvdKZ5" target="_blank">Discord beitreten</a>

		</div>

		<!-- TABELLE -->

		<div id="tabelle" class="page">
			<h2>Tabelle</h2>
			<table>
				<thead>
					<tr>
						<th>Spieler</th>
						<th>Spiele</th>
						<th>Siege</th>
						<th>Niederlagen</th>
						<th>Punkte</th>
					</tr>
				</thead>
				<tbody id="tableBody"></tbody>
			</table>
		</div>

		<!-- ERGEBNISSE -->

		<div id="ergebnisse" class="page">
			<h2>Ergebnisse</h2>
			<table>
				<thead>
					<tr>
						<th>Spieler A</th>
						<th>Ergebnis</th>
						<th>Spieler B</th>
					</tr>
				</thead>
				<tbody id="resultsBody"></tbody>
			</table>
		</div>

		<!-- NEWS -->

		<div id="news" class="page">
			<h2>News</h2>
			<p>Hier kommen später News rein</p>
		</div>

		<!-- REGELN -->

		<div id="regeln" class="page">
			<h2>Regeln</h2>
			<p>Matchorganisation, Fairplay etc.</p>
		</div>

		<script>

			// Navigation
			document.querySelectorAll("nav a").forEach(link => {
			link.addEventListener("click", () => {
			document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
			document.querySelectorAll("nav a").forEach(l => l.classList.remove("active"));

			document.getElementById(link.dataset.page).classList.add("active");
			link.classList.add("active");
			});
			});

			// GOOGLE SHEETS CSV
			const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9cqFKQxjTBcRuUVivV8uEK4IQwpFZXbi82FjcaKiY8RXPRnbqmfhg0MdW31qJqtv7P2Fn9loUxYFM/pub?output=csv";

			fetch(CSV)
			.then(res => res.text())
			.then(data => {

			const rows = data.split("\n").slice(1);
			const players = {};

			rows.forEach(r => {
			const [datum, plattform, a, b, la, lb] = r.split(",");

			if (!a || !b) return;

			if (!players[a]) players[a] = {spiele:0,siege:0,niederlagen:0,punkte:0};
			if (!players[b]) players[b] = {spiele:0,siege:0,niederlagen:0,punkte:0};

			players[a].spiele++;
			players[b].spiele++;

			if (Number(la) > Number(lb)) {
			players[a].siege++;
			players[b].niederlagen++;
			players[a].punkte += 2;
			} else {
			players[b].siege++;
			players[a].niederlagen++;
			players[b].punkte += 2;
			}

			document.getElementById("resultsBody").innerHTML += `
			<tr>
				<td>${a}</td>
				<td>${la}:${lb}</td>
				<td>${b}</td>
			</tr>`;
			});

			Object.keys(players).forEach(p => {
			const pl = players[p];
			document.getElementById("tableBody").innerHTML += `
			<tr>
				<td>${p}</td>
				<td>${pl.spiele}</td>
				<td>${pl.siege}</td>
				<td>${pl.niederlagen}</td>
				<td>${pl.punkte}</td>
			</tr>`;
			});

			});

		</script>

	</body>
</html>
