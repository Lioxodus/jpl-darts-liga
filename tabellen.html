<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabellen - JPL Darts Liga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="JPL Darts Liga Logo" />
    <h1>JPL Darts Liga</h1>
    <p>Online Darts Liga für Scolia und AutoDarts</p>
  </header>

  <nav>
    <a href="index.html" class="">Start</a>
    <a href="tabellen.html" class="active">Tabellen</a>
    <a href="spieltage.html" class="">Spieltage</a>
    <a href="news.html" class="">News</a>
    <a href="regeln.html" class="">Regeln</a>
  </nav>

  <main>
    <section>
      <div class="panel">
        <div class="panel-header">
          <div>
            <h2 id="leagueTitle">Scolia Tabelle</h2>
            <p class="small-info">Wähle aus, welche Tabelle du sehen willst.</p>
          </div>
          <span class="tag">Tabellen</span>
        </div>

        <div class="league-switch">
          <button class="switch-btn active" data-league="Scolia">Scolia</button>
          <button class="switch-btn" data-league="DartCounter">DartCounter</button>
          <button class="switch-btn" data-league="AutoDarts 1">AutoDarts Liga 1</button>
          <button class="switch-btn" data-league="AutoDarts 2">AutoDarts Liga 2</button>
          <button class="switch-btn" data-league="AutoDarts 3">AutoDarts Liga 3</button>
          <button class="switch-btn" data-league="AutoDarts 4">AutoDarts Liga 4</button>
        </div>

        <p id="leagueStatus" class="status-line">Lade Tabelle...</p>

        <table>
          <thead>
            <tr>
              <th>Platz</th>
              <th>Spieler</th>
              <th>Spiele</th>
              <th>Siege</th>
              <th>Niederlagen</th>
              <th>Legs +</th>
              <th>Legs -</th>
              <th>Leg-Diff.</th>
              <th>Punkte</th>
            </tr>
          </thead>
          <tbody id="leagueTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
  <p>
    © JPL Darts Liga |
    <a href="impressum.html">Impressum</a> |
    <a href="datenschutz.html">Datenschutz</a>
  </p>
</footer>

  <script src="app.js"></script>
</body>
</html>
